- type: organizing-committee-memberships
  text: '[UN Open Source Week Community Side events](https://www.un.org/digital-emerging-technologies/content/open-source-week-2025). Organising and program committee, collaborating closely with the UN Office for Digital and Emerging Technology, for the planning and execution of the multi-track community side events during the UN Open Source week. 2025-2026.'
- type: organizing-committee-memberships
  text: '[The Swedish OSPO network](https://swedish-ospo-network.se/). A national network for companies and public administrations with support functions for promoting and enabling the use and collaboration of open source software. Arranging regular physical workshops and online webinars to share knowledge and establish common practice. 2023-ongoing.'
- type: organizing-committee-memberships
  text: '[Öppen källkod som strategi för en hållbar infrastruktur](https://internetdagarna.se/event/oppen-kallkod-som-strategi-for-en-hallbar-infrastruktur/). Theme track. Internetdagarna ([The Internet Days](https://internetdagarna.se/en/)), 2022.'
- type: organizing-committee-memberships
  text: '[Digitala allmänningar: så skapar vi samhällsnytta](https://arkiv.internetdagarna.se/2021/index.html%3Fp=422.html). Theme track. Internetdagarna ([The Internet Days](https://internetdagarna.se/en/)), 2021.'
- type: organizing-committee-memberships
  text: Öppen källkod som grund för den digitala allemansrätten. Theme track. [Foss-north](https://foss-north.se/), 2021.
- type: organizing-committee-memberships
  text: Network Open Source and Data ([NOSAD](https://nosad.se)). National public sector network for sharing knowledge on how to use and collaborate on open data, open standards, and open source software. Arranged [30+ virtual and physical workshops and seminars](https://nosad.se/workshops), 2019-ongoing.
- type: maintainerships
  text: '[Offentligkod.se](https://offentligkod.se). Catalogue of open source software used by public-sector entities in Sweden. Includes implementation and co-development of the international metadata standard for public code, public-code.yml.'
