<!-- _includes/pub-filter.html
     Live filter for a page made of Markdown lists under headings.
     Include this file in the page where the search box should appear.
     Everything AFTER the box is filterable; lists before it (e.g. the "Sections" TOC) are left alone. -->
<div class="pub-filter" id="pub-filter-wrap">
  <label for="pub-filter" class="pub-filter__label">Search publications</label>
  <input type="search" id="pub-filter" placeholder="Title, author, venue, year…" autocomplete="off">
  <p class="pub-filter__count" id="pub-filter-count" aria-live="polite"></p>
</div>

<style>
  .pub-filter { margin: 1.5em 0 2em; }
  .pub-filter__label { display: block; font-size: .8em; font-weight: bold; margin-bottom: .3em; }
  .pub-filter input { width: 100%; max-width: 32em; padding: .5em .75em; font-size: .9em; }
  .pub-filter__count { font-size: .75em; margin: .4em 0 0; min-height: 1.2em; opacity: .75; }
</style>

<script>
(function () {
  var wrap    = document.getElementById('pub-filter-wrap');
  var input   = document.getElementById('pub-filter');
  var countEl = document.getElementById('pub-filter-count');
  var content = wrap.parentElement;

  // Only elements that come after the search box
  var els = Array.prototype.filter.call(content.children, function (el) {
    return wrap.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING;
  });

  // Lowercase and strip accents so "linaker" matches "Linåker", "oppen" matches "öppen"
  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  // Cache the text of each top-level list item once
  var items = [];
  els.forEach(function (el) {
    if (el.tagName === 'UL' || el.tagName === 'OL') {
      Array.prototype.forEach.call(el.children, function (li) {
        if (li.tagName === 'LI') items.push({ li: li, list: el, text: norm(li.textContent) });
      });
    }
  });

  function run() {
    var terms = norm(input.value).trim().split(/\s+/).filter(Boolean);
    var shown = 0;
    var listHasMatch = new Map();

    items.forEach(function (it) {
      var match = terms.every(function (t) { return it.text.indexOf(t) !== -1; });
      it.li.hidden = !match;
      if (match) { shown++; listHasMatch.set(it.list, true); }
    });

    // Hide empty lists, then hide headings with nothing visible under them (walk backwards)
    var subVisible = false, sectionVisible = false;
    for (var i = els.length - 1; i >= 0; i--) {
      var el = els[i], tag = el.tagName;
      if (tag === 'UL' || tag === 'OL') {
        el.hidden = !listHasMatch.get(el);
        if (!el.hidden) { subVisible = true; sectionVisible = true; }
      } else if (/^H[3-6]$/.test(tag)) {      // year sub-headings (####)
        el.hidden = !subVisible;
        subVisible = false;
      } else if (tag === 'H2') {               // section headings (##)
        el.hidden = !sectionVisible;
        sectionVisible = false;
        subVisible = false;
      }
    }

    countEl.textContent = terms.length
      ? (shown ? shown + ' of ' + items.length + ' items match' : 'No matches. Try fewer or shorter words.')
      : '';

    // Keep the search in the URL so a filtered view can be shared, e.g. /publications/?q=public+sector
    var url = new URL(window.location);
    if (terms.length) url.searchParams.set('q', input.value.trim());
    else url.searchParams.delete('q');
    history.replaceState(null, '', url);
  }

  var q = new URLSearchParams(window.location.search).get('q');
  if (q) input.value = q;

  input.addEventListener('input', run);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { input.value = ''; run(); }
  });
  run();
})();
</script>
