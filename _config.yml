# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Virtual Home of Johan Linåker
email: johan [dot] linaker [at] ri [dot] se
description: "Johan Linåker researches open source software, open source AI and data sharing as levers for digital sovereignty, interoperability and open innovation."
locale: 'en-GB'
github_username: johanlinaker
minimal_mistakes_skin: default
search: true
search_full_content: true
url: 'https://www.linaker.se' # your main domain
baseurl: '' # if you're using custom domain keep this blank example: baseurl: ''

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Europe/Stockholm # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-seo-tag

author:
  name   : "Johan Linåker"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Senior Researcher at <a href=\"https://www.ri.se/en/person/johan-linaker\" target=\"_top\">RISE Research Institutes of Sweden</a> and Adjunct Assistant Professor at <a href=\"https://portal.research.lu.se/sv/persons/johan-lin%C3%A5ker\" target=\"_top\">Lund University</a>"
  links:
    - label: "Mastodon"
      icon: "fab fa-mastodon"
      url: "https://mastodon.acm.org/@johanlinaker"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/johanlinaker"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/johanlinaker/"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar fa-lg"
      url: "https://scholar.google.com/citations?user=InMNgF0AAAAJ&hl=sv&oi=ao"
    - label: "Orcid"
      icon: "ai ai-orcid"
      url: "https://orcid.org/0000-0001-9851-1404"
    - label: "Hugging Face"
      icon: "facepalm"
      url: "https://huggingface.co/johanlinaker"
      
social:
  type: Person
  name: "Johan Linåker"
  links:
    - "https://orcid.org/0000-0001-9851-1404"
    - "https://scholar.google.com/citations?user=InMNgF0AAAAJ"
    - "https://www.ri.se/en/person/johan-linaker"
    - "https://portal.research.lu.se/sv/persons/johan-lin%C3%A5ker"
    - "https://github.com/johanlinaker"
    - "https://www.linkedin.com/in/johanlinaker/"
    - "https://mastodon.acm.org/@johanlinaker"
    - "https://huggingface.co/johanlinaker"

og_image: "/assets/images/bio-photo.jpg"

footer:

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
